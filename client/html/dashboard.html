<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Leave Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <div class="min-h-screen">
    <header class="border-b border-white/10 bg-slate-900/80 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <div>
          <p class="text-sm text-cyan-300">Leave Management System</p>
          <h1 class="text-2xl font-bold">Dashboard</h1>
        </div>
        <button
          id="logoutBtn"
          class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/10"
        >
          Logout
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-6 py-10">
      <section class="mb-8 rounded-3xl border border-white/10 bg-white/5 p-6 shadow-xl">
        <p class="text-sm uppercase tracking-wider text-slate-400">Welcome back</p>
        <h2 id="welcomeName" class="mt-2 text-3xl font-bold">User</h2>
        <p id="welcomeRole" class="mt-2 text-slate-300">Role: -</p>
      </section>

      <section class="grid gap-6 md:grid-cols-3">
        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-6">
          <p class="text-sm text-slate-400">Leave Balance</p>
          <h3 class="mt-3 text-3xl font-bold text-cyan-300">12 Days</h3>
          <p class="mt-2 text-sm text-slate-500">Sample value for dashboard starter UI.</p>
        </div>

        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-6">
          <p class="text-sm text-slate-400">Pending Requests</p>
          <h3 class="mt-3 text-3xl font-bold text-amber-300">3</h3>
          <p class="mt-2 text-sm text-slate-500">Managers and admins can review requests here.</p>
        </div>

        <div class="rounded-3xl border border-white/10 bg-slate-900/70 p-6">
          <p class="text-sm text-slate-400">Approved This Month</p>
          <h3 class="mt-3 text-3xl font-bold text-emerald-300">5</h3>
          <p class="mt-2 text-sm text-slate-500">Starter dashboard card for future API integration.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/dashboard.js"></script>
</body>
</html>
