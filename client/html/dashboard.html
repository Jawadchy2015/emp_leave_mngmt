<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Leave Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="min-h-screen flex">
      <!-- Sidebar -->
      <aside
        class="w-72 bg-slate-900/95 border-r border-white/10 hidden lg:flex flex-col"
      >
        <div class="px-6 py-6 border-b border-white/10">
          <div class="flex items-center gap-3">
            <div
              class="h-11 w-11 rounded-2xl bg-cyan-500/15 ring-1 ring-cyan-400/20 flex items-center justify-center text-cyan-300 font-bold text-lg"
            >
              LM
            </div>
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-slate-400">
                Leave System
              </p>
              <h1 class="text-lg font-semibold">Workforce Portal</h1>
            </div>
          </div>
        </div>

        <div class="px-6 pt-6 pb-4 border-b border-white/10">
          <p class="text-xs text-slate-400 uppercase tracking-wider">
            Signed in as
          </p>
          <h2 id="sidebarUserName" class="mt-2 text-lg font-semibold">User</h2>
          <p id="sidebarUserRole" class="text-sm text-cyan-300 capitalize">
            Role
          </p>
        </div>

        <nav
          id="sidebarNav"
          class="flex-1 px-4 py-4 space-y-1 overflow-y-auto"
        ></nav>

        <div class="px-4 py-4 border-t border-white/10">
          <button
            id="logoutBtnDesktop"
            class="w-full rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-3 text-sm font-medium transition"
          >
            Logout
          </button>
        </div>
      </aside>

      <!-- Main -->
      <div class="flex-1 flex flex-col min-w-0">
        <!-- Topbar -->
        <header
          class="border-b border-white/10 bg-slate-950/90 backdrop-blur sticky top-0 z-30"
        >
          <div class="px-4 sm:px-6 py-4 flex items-center justify-between">
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-slate-500">
                Dashboard
              </p>
              <h2 id="topbarTitle" class="text-2xl font-semibold">Overview</h2>
            </div>

            <div class="flex items-center gap-3">
              <div class="hidden sm:block text-right">
                <p id="topbarUserName" class="text-sm font-medium">User</p>
                <p
                  id="topbarUserRole"
                  class="text-xs text-slate-400 capitalize"
                >
                  Role
                </p>
              </div>
              <div
                class="h-11 w-11 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-cyan-300 font-semibold"
              >
                <span id="userInitials">U</span>
              </div>
              <button
                id="logoutBtnMobile"
                class="lg:hidden rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 text-sm"
              >
                Logout
              </button>
            </div>
          </div>
        </header>

        <!-- Content -->
        <main class="p-4 sm:p-6 lg:p-8 space-y-8">
          <!-- Welcome -->
          <section
            class="rounded-3xl border border-white/10 bg-gradient-to-br from-slate-900 to-slate-900/60 p-6 sm:p-8 shadow-2xl"
          >
            <div
              class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6"
            >
              <div>
                <p class="text-sm uppercase tracking-[0.25em] text-cyan-300">
                  Welcome back
                </p>
                <h3
                  id="welcomeHeading"
                  class="mt-3 text-3xl sm:text-4xl font-bold leading-tight"
                >
                  Hello, User
                </h3>
                <p id="welcomeSubtext" class="mt-3 max-w-2xl text-slate-400">
                  Here is a quick overview of your leave management workspace.
                </p>
              </div>

              <div class="grid grid-cols-2 gap-4 min-w-[280px]">
                <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
                  <p class="text-xs uppercase tracking-wider text-slate-400">
                    Current Role
                  </p>
                  <p
                    id="heroRole"
                    class="mt-3 text-xl font-semibold capitalize"
                  >
                    Employee
                  </p>
                </div>
                <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
                  <p class="text-xs uppercase tracking-wider text-slate-400">
                    Status
                  </p>
                  <p class="mt-3 text-xl font-semibold text-emerald-300">
                    Active
                  </p>
                </div>
              </div>
            </div>
          </section>

          <!-- KPI cards -->
          <section
            id="summaryCards"
            class="grid gap-5 sm:grid-cols-2 xl:grid-cols-4"
          ></section>

          <!-- Dynamic section container -->
          <section id="pageContent" class="space-y-6"></section>
        </main>
      </div>
    </div>

    <script src="../js/dashboard.js"></script>
  </body>
</html>
